spring.datasource.url=jdbc:mysql://localhost:3306/finisus?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.username=${FINISUS_DB_USERNAME}
spring.datasource.password=${FINISUS_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

app.jwt.private-key-location=${FINISUS_JWT_PRIVATE_KEY_LOCATION}
app.jwt.public-key-location=${FINISUS_JWT_PUBLIC_KEY_LOCATION}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging.level.com.finisus=DEBUG
logging.level.org.springframework.security=INFO
