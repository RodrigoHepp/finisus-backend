spring.application.name=finisus-backend
spring.jackson.default-property-inclusion=non_null
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.error.include-message=never
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

app.importacao.pdf.max-pages=100
app.importacao.pdf.max-extracted-characters=2000000
app.importacao.pdf.max-processing-time=5s
app.importacao.pdf.max-main-memory-bytes=8388608

server.servlet.context-path=/

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

app.jwt.issuer=finisus-backend
app.jwt.access-token-expiration-minutes=15
app.jwt.refresh-token-expiration-days=7
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.security.rate-limit.authentication.enabled=${APP_AUTH_RATE_LIMIT_ENABLED:true}
app.security.rate-limit.authentication.max-requests=${APP_AUTH_RATE_LIMIT_MAX_REQUESTS:30}
app.security.rate-limit.authentication.window=${APP_AUTH_RATE_LIMIT_WINDOW:1m}
app.security.rate-limit.authentication.max-identifiers=${APP_AUTH_RATE_LIMIT_MAX_IDENTIFIERS:10000}
app.recorrencias.timezone=America/Sao_Paulo

springdoc.api-docs.path=/api/v1/docs
springdoc.swagger-ui.path=/api/v1/swagger-ui.html

logging.pattern.console={"timestamp":"%d{ISO8601}","level":"%p","logger":"%c","correlationId":"%X{correlationId}","message":"%m"}%n
