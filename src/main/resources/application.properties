spring.application.name=finisus-backend
spring.jackson.default-property-inclusion=non_null
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.web.error.include-message=never
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.servlet.context-path=/

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

app.jwt.issuer=finisus-backend
app.jwt.access-token-expiration-minutes=15
app.jwt.refresh-token-expiration-days=7
app.cors.allowed-origins=*
app.recorrencias.timezone=America/Sao_Paulo

springdoc.api-docs.path=/api/v1/docs
springdoc.swagger-ui.path=/api/v1/swagger-ui.html

logging.pattern.console={"timestamp":"%d{ISO8601}","level":"%p","logger":"%c","correlationId":"%X{correlationId}","message":"%m"}%n
