spring:
  datasource:
    url: jdbc:mysql://localhost:3306/finisus?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: ${FINISUS_DB_USERNAME}
    password: ${FINISUS_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  jwt:
    private-key-location: ${FINISUS_JWT_PRIVATE_KEY_LOCATION}
    public-key-location: ${FINISUS_JWT_PUBLIC_KEY_LOCATION}

logging:
  level:
    com.financeiro: DEBUG
    org.springframework.security: INFO
